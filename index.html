<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no
        "
    >

    <title>Exhibition Space</title>


    <!-- ===================================================
         GOOGLE FONTS
         =================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500&display=swap"
        rel="stylesheet"
    >


    <!-- ===================================================
         STYLES
         =================================================== -->

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/theme.css"
    >

    <link
        rel="stylesheet"
        href="/css/exhibition-shop.css"
    >

</head>

<body>

    <div id="viewer">

        <div
            id="product-label-layer"
            aria-label="Product information"
        ></div>


        <div id="loading">
            LOADING EXHIBITION SPACE...
        </div>


        <div id="hud">

            <small
                class="desktop-instructions"
            >
                CLICK / W / E / + / − / CTRL+D
            </small>

            <small
                class="mobile-instructions"
            >
                TAP AN OBJECT, THEN CHOOSE A TOOL
            </small>

        </div>


        <div id="top-controls">

            <button
                id="toggle-version-history"
                type="button"
                aria-controls="version-history-panel"
                aria-expanded="false"
            >
                ARCHIVE
            </button>

            <button
                id="save-composition"
                type="button"
            >
                SAVE
            </button>

            <div
                id="save-status"
                aria-live="polite"
            ></div>

        </div>


        <nav
            id="mobile-toolbar"
            aria-label="Mobile exhibition tools"
        >

            <button
                class="mobile-tool-button"
                type="button"
                data-tool="translate"
                data-active="true"
            >
                MOVE
            </button>

            <button
                class="mobile-tool-button"
                type="button"
                data-tool="rotate"
                data-active="false"
            >
                ROTATE
            </button>

            <button
                id="mobile-scale-up"
                class="mobile-tool-button"
                type="button"
            >
                SIZE+
            </button>

            <button
                id="mobile-scale-down"
                class="mobile-tool-button"
                type="button"
            >
                SIZE−
            </button>

            <button
                id="mobile-undo"
                class="mobile-tool-button"
                type="button"
            >
                BACK
            </button>

            <button
                id="mobile-multi"
                class="mobile-tool-button"
                type="button"
                data-active="false"
            >
                MULTI
            </button>

            <button
                id="mobile-hide"
                class="mobile-tool-button"
                type="button"
            >
                HIDE
            </button>

            <button
                id="mobile-show"
                class="mobile-tool-button"
                type="button"
            >
                SHOW
            </button>

            <button
                id="mobile-duplicate"
                class="mobile-tool-button"
                type="button"
            >
                DUPLICATE
            </button>

            <button
                id="mobile-save"
                class="mobile-tool-button mobile-save-button"
                type="button"
            >
                SAVE
            </button>

        </nav>


        <div
            id="mobile-tool-status"
            aria-live="polite"
        >
            TAP AN OBJECT TO BEGIN
        </div>


        <aside
            id="version-history-panel"
            data-open="false"
            aria-hidden="true"
            aria-label="Exhibition version history"
        >

            <header
                id="version-history-header"
            >

                <div>

                    <div
                        id="version-history-title"
                    >
                        ARCHIVE
                    </div>

                    <div
                        id="version-history-description"
                    >
                        SAVED EXHIBITION STATES
                    </div>

                </div>

                <button
                    id="close-version-history"
                    type="button"
                    aria-label="Close archive"
                >
                    ×
                </button>

            </header>


            <div
                id="version-history-actions"
            >

                <button
                    id="refresh-version-history"
                    type="button"
                >
                    REFRESH
                </button>

            </div>


            <div
                id="version-preview-status"
                aria-live="polite"
            ></div>


            <div
                id="version-history-list"
                aria-live="polite"
            ></div>

        </aside>

    </div>


    <script
        type="module"
        src="/js/main.js"
    ></script>

</body>

</html>
