<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0
        "
    >

    <title>Object</title>


    <!-- ===================================================
         GOOGLE FONTS
         =================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Grenze:wght@300;400;500;600&family=Permanent+Marker&display=swap"
        rel="stylesheet"
    >


    <!-- ===================================================
         STYLES
         =================================================== -->

    <link
        rel="stylesheet"
        href="/css/theme.css"
    >

    <link
        rel="stylesheet"
        href="/css/product.css"
    >

</head>

<body>

    <header class="product-header">

        <a
            class="product-back"
            href="/"
        >
            ← EXHIBITION
        </a>

        <button
            id="cart-button"
            type="button"
        >
            CART

            <span id="cart-count">
                0
            </span>
        </button>

    </header>


    <main
        id="product-page"
        class="product-page"
    >

        <section
            class="product-visual"
            aria-label="3D object viewer"
        >

            <div
                id="product-model-viewer"
                class="product-model-viewer"
            ></div>


            <div
                id="product-model-status"
                class="product-model-status"
            >
                LOADING 3D OBJECT...
            </div>


            <div
                class="product-model-caption"
            >

                <span>
                    3D SCAN
                </span>

                <span>
                    DRAG / ZOOM
                </span>

            </div>

        </section>


        <section
            class="product-information"
        >

            <div
                id="product-status"
                class="product-status"
            >
                LOADING...
            </div>


            <div
                id="product-content"
                hidden
            >

                <div class="product-heading">

                    <p
                        id="product-catalogue-number"
                        class="product-catalogue-number"
                    ></p>

                    <p
                        id="product-subtitle"
                        class="product-kicker"
                    ></p>

                    <h1
                        id="product-title"
                    ></h1>

                    <div
                        id="product-year"
                        class="product-year"
                    ></div>

                </div>


                <div class="product-purchase">

                    <div
                        id="product-price"
                        class="product-price"
                    ></div>

                    <button
                        id="add-to-cart"
                        type="button"
                    >
                        ADD TO CART →
                    </button>

                    <div
                        id="cart-status"
                        class="cart-status"
                        aria-live="polite"
                    ></div>

                </div>


                <dl class="product-facts">

                    <div>

                        <dt>
                            MATERIAL
                        </dt>

                        <dd
                            id="product-materials"
                        ></dd>

                    </div>


                    <div>

                        <dt>
                            DIMENSIONS
                        </dt>

                        <dd
                            id="product-dimensions"
                        ></dd>

                    </div>


                    <div>

                        <dt>
                            AVAILABILITY
                        </dt>

                        <dd
                            id="product-availability"
                        ></dd>

                    </div>


                    <div>

                        <dt>
                            EDITION
                        </dt>

                        <dd
                            id="product-edition"
                        ></dd>

                    </div>

                </dl>


                <div
                    id="product-short-description"
                    class="product-short-description"
                ></div>


                <div
                    id="product-description"
                    class="product-description"
                ></div>


                <div
                    class="product-detail-section"
                >

                    <h2>
                        DETAILS
                    </h2>

                    <ul
                        id="product-details"
                    ></ul>

                </div>


                <div
                    class="product-detail-section"
                >

                    <h2>
                        SHIPPING
                    </h2>

                    <p
                        id="product-shipping"
                    ></p>

                </div>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="/js/product-page.js"
    ></script>

</body>

</html>
